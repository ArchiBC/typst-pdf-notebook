<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
    <title>PDF 阅读笔记</title>
    <link rel="stylesheet" href="{{PDFCSS}}" />
    <link rel="stylesheet" href="{{CSS}}" />
  </head>
  <body>
    <header>
      <button id="toggle-outline" title="书签" aria-label="切换书签">☰</button
      ><strong id="title">PDF 阅读笔记</strong><span class="spacer"></span
      ><label class="page-label"
        ><input id="page" type="number" min="1" value="1" aria-label="页面" /><span id="total"
          >/ —</span
        ></label
      ><button id="zoom-out" aria-label="缩小">−</button
      ><select id="zoom" aria-label="缩放">
        <option value="width">适合页宽</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option id="custom-zoom" hidden></option></select
      ><button id="zoom-in" aria-label="放大">+</button>
      <select id="annotation-style" aria-label="引用标记样式" title="所有引用的标记样式">
        <option value="underline">下划线</option>
        <option value="highlight">高亮</option>
      </select>
      <button id="clip-tool" aria-pressed="false" title="拖框复制原书选区的 Typst 引用">框选</button
      ><button id="export">导出 PDF</button>
    </header>
    <main>
      <aside id="sidebar">
        <h2>书签与笔记</h2>
        <input id="filter" placeholder="筛选书签…" aria-label="筛选书签" />
        <nav id="outline"></nav>
      </aside>
      <section id="viewer" aria-label="整本笔记预览">
        <div id="problem" role="alert" hidden>
          <strong>无法更新笔记预览</strong>
          <p id="problem-hint"></p>
          <button id="upgrade-template" hidden>升级模板并重试</button>
          <details>
            <summary>错误详情</summary>
            <pre id="problem-detail"></pre>
          </details>
        </div>
        <div id="pages"></div>
        <div id="empty">正在加载笔记与原书…</div>
      </section>
    </main>
    <div id="selection-actions" hidden>
      <button id="write-comment" type="button">写注释</button>
    </div>
    <form id="comment-card" role="dialog" aria-label="侧页注释" hidden>
      <strong id="comment-title">侧页注释</strong>
      <blockquote id="comment-excerpt"></blockquote>
      <textarea
        id="comment-body"
        aria-label="注释正文"
        placeholder="写下你的想法…"
        maxlength="32000"
      ></textarea>
      <div id="comment-error" role="alert"></div>
      <div class="comment-buttons">
        <button type="button" id="cancel-comment">取消</button>
        <button type="submit" id="save-comment">加入笔记</button>
      </div>
    </form>
    <footer>
      <span id="status" role="status">正在连接…</span><span class="spacer"></span
      ><span>笔记 Ctrl + 单击返回源码</span>
    </footer>
    <script nonce="{{NONCE}}">
      window.notebookAssets={{CONFIG}};window.notebookHost=acquireVsCodeApi();function viewerFailure(text){document.querySelector('#status').textContent=text;window.notebookHost.postMessage({type:'viewer-error',text})}addEventListener('error',e=>viewerFailure(e.message||'预览资源加载失败'));addEventListener('unhandledrejection',e=>viewerFailure(String(e.reason?.message||e.reason)));
    </script>
    <script type="module" src="{{JS}}" nonce="{{NONCE}}"></script>
  </body>
</html>
